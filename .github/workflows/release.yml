name: Release and Push to NPM Registry

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # semantic-release pushes with the GITHUB_TOKEN env below. A credential
          # persisted in .git/config would silently take precedence over it.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Build package
        run: npm run build

      - name: Semantic release
        run: npx semantic-release
        env:
          # PAT of the lime-opensource service user, which pushes the release
          # commit and creates the GitHub release in public repos.
          GITHUB_TOKEN: ${{ secrets.LIME_OPENSOURCE_SEMANTIC_RELEASE }}
          # Provenance is required by n8n for verified community nodes.
          NPM_CONFIG_PROVENANCE: 'true'
          # Lets the prepublishOnly guard (n8n-node prerelease) allow the publish.
          RELEASE_MODE: 'true'
