name: Release and Push to NPM Registry

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # Do not leave the Actions token in .git/config. semantic-release
          # authenticates its own push from GITHUB_TOKEN below, which must be a
          # lime-ci token to bypass the branch ruleset on main -- a persisted
          # GITHUB_TOKEN credential would silently take precedence and be rejected.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Build package
        run: npm run build

      # Reports token availability without exposing the secret value: the expression
      # collapses the secrets to a "yes"/"no" string, so only that derived flag --
      # never the token itself -- enters the shell environment.
      - name: Report release token availability
        env:
            has_token: ${{ (secrets.DISPATCH_TOKEN != '' || secrets.LIME_CI_SEMANTIC_RELEASE != '') && 'yes' || 'no' }}
        run: |
            if [ "$has_token" = "yes" ]; then
                echo "::notice::Token available to push release with branch protection: yes"
            else
                echo "::warning::Token available to push release with branch protection: no. The ruleset on main only grants bypass to the lime-ci team, so the release commit push will be rejected. Set up the LIME_CI_SEMANTIC_RELEASE org secret or the DISPATCH_TOKEN repo secret."
            fi

      - name: Semantic release
        run: npx semantic-release
        env:
          # Same hierarchy as Lundalogik/lime-workflows release-limepkg.yml@v3:
          # a lime-ci token first (the only bypass actor on main's ruleset), with
          # the Actions token as a last resort.
          GITHUB_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.LIME_CI_SEMANTIC_RELEASE || secrets.GITHUB_TOKEN }}
          # Provenance is required by n8n for verified community nodes.
          NPM_CONFIG_PROVENANCE: 'true'
          # Lets the prepublishOnly guard (n8n-node prerelease) allow the publish.
          RELEASE_MODE: 'true'
