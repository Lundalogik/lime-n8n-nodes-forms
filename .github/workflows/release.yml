name: Release and Push to NPM Registry

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest

    # semantic-release authenticates with the lime-ci tokens below, so the job
    # token itself only needs to read the repository.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # semantic-release pushes with the GITHUB_TOKEN env below. A credential
          # persisted in .git/config would silently take precedence over it.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Build package
        run: npm run build

      - name: Semantic release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.LIME_CI_SEMANTIC_RELEASE }}
          # Publishing to npm.pkg.github.com needs write:packages, which the
          # semantic-release token deliberately does not carry.
          NPM_TOKEN: ${{ secrets.LIME_CI_WRITE_PACKAGES }}
          RELEASE_MODE: 'true'
